services:
  mariadb:
    image: 'mariadb:11'
    container_name: uvt_events_db
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
      MARIADB_DATABASE: '${DB_DATABASE}'
      MARIADB_USER: '${DB_USERNAME}'
      MARIADB_PASSWORD: '${DB_PASSWORD}'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    volumes:
      - 'mariadb_data:/var/lib/mysql'
      - './docker/mysql/init:/docker-entrypoint-initdb.d'
    networks:
      - uvt_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  phpmyadmin:
    image: 'phpmyadmin:5'
    container_name: uvt_events_phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: admin
      PMA_PASSWORD: change-me
      UPLOAD_LIMIT: 64M
    ports:
      - '${FORWARD_PHPMYADMIN_PORT:-8080}:80'
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - uvt_network
    restart: unless-stopped

  redis:
    image: 'redis:alpine'
    container_name: uvt_events_redis
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis_data:/data'
    networks:
      - uvt_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uvt_events_app
    working_dir: /var/www/html
    environment:
      CONTAINER_ROLE: app
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - './:/var/www/html'
      - 'vendor_data:/var/www/html/vendor'
    ports:
      - '${APP_PORT:-8000}:8000'
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/app-ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s
    networks:
      - uvt_network
    restart: unless-stopped

  php-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uvt_events_worker
    working_dir: /var/www/html
    environment:
      CONTAINER_ROLE: worker
    command: php artisan queue:work redis --verbose --tries=3 --timeout=90
    volumes:
      - './:/var/www/html'
      - 'vendor_data:/var/www/html/vendor'
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - uvt_network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uvt_events_scheduler
    working_dir: /var/www/html
    environment:
      CONTAINER_ROLE: scheduler
    command: php artisan schedule:work
    volumes:
      - './:/var/www/html'
      - 'vendor_data:/var/www/html/vendor'
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - uvt_network
    restart: unless-stopped

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  vendor_data:
    driver: local

networks:
  uvt_network:
    driver: bridge
